# Pin the JVM locale: a Turkish default locale turns "i".uppercase() into "İ".
org.gradle.jvmargs=-Xmx2g -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
