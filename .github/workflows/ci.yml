name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests (JVM + Kotlin/JS on Node + server)
        shell: bash
        run: ./gradlew allTests :server:test :cli:test --console=plain
      - name: CLI smoke test
        shell: bash
        run: |
          ./gradlew :cli:installDist --console=plain -q
          rota=cli/build/install/rota/bin/rota
          $rota init oncall -o team.rota
          $rota check team.rota
          $rota solve team.rota --certify --no-color
          $rota init impossible -o holiday.rota
          set +e; $rota solve holiday.rota --no-color; code=$?; set -e
          test "$code" = "2"
      - name: Benchmark
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: cli/build/install/rota/bin/rota bench

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t rota-server .
      - name: Smoke test
        run: |
          docker run -d --name rota -p 8080:8080 rota-server
          for i in $(seq 1 30); do curl -fs localhost:8080/api/health && break; sleep 1; done
          curl -fs --data-binary "period 2026-11-02 for 1 weeks
          shift day weekdays 09:00-17:00
          person Ana
          person Ben" localhost:8080/api/solve | grep '"ok":true'
          curl -fs localhost:8080/ | grep -q '<title>rota'
